
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Replacement Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Page Replacement Algorithm Simulator</h1>

    <p>Compare different page replacement algorithms.</p>

    <div class="container">

        <div class="input-section">

            <h2>Simulation Settings</h2>

            <label for="pages">Page Reference String:</label>

            <input
                type="text"
                id="pages"
                placeholder="Example: 7, 0, 1, 2, 0, 3, 0, 4"
            >

            <label for="frames">Number of Memory Frames:</label>

            <input
                type="number"
                id="frames"
                placeholder="Enter number of frames"
                min="1"
            >

            <button id="simulateBtn">Run Simulation</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
