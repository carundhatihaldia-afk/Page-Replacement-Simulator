
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Replacement Algorithm Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Page Replacement Algorithm Simulator</h1>
        <p>Compare different page replacement algorithms in Operating Systems.</p>
    </header>

    <main class="container">

        <!-- Simulation Input Section -->

        <section class="input-section">

            <h2>Simulation Settings</h2>

            <label for="pages">Page Reference String:</label>

            <input
                type="text"
                id="pages"
                placeholder="Example: 7, 0, 1, 2, 0, 3, 0, 4"
            >

            <label for="frames">Number of Memory Frames:</label>

            <input
                type="number"
                id="frames"
                placeholder="Enter number of frames"
                min="1"
            >

            <button id="simulateBtn">Run Simulation</button>

        </section>

        <!-- Simulation Results Section -->

        <section id="results" class="results-section">

        </section>

    </main>

    <footer>
        <p>Operating Systems Project | Page Replacement Analysis</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
